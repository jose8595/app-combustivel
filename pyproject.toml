[project]
name = "app-combustivel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.4",
]

[project.scripts]
app-combustivel = "app_combustivel:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flet[all]>=1.0.4",
]

[tool.flet]
product = "Gasolina ou Etanol"
org = "com.joserenildes"
icon_background = "#E8F5E9"